<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">

    <div class="scanbar">
      <span class="scan-dot" id="scanDot"></span>
      <span class="scan-url" id="scanUrl">idle</span>
    </div>

    <header>
      <div class="header-title">
        <svg class="header-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M20 20L16.5 16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <h1>SEO Analyzer</h1>
      </div>
      <p class="subtitle">Full on-page & technical SEO scan</p>
    </header>

    <button id="analyzeBtn">Analyze This Page</button>

    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <span>Scanning page...</span>
    </div>

    <div id="results" class="hidden">

      <div class="grade-module">
        <div class="score-circle">
          <svg class="score-ring" viewBox="0 0 120 120">
            <circle class="score-ring-bg" cx="60" cy="60" r="52"></circle>
            <circle id="scoreRingFill" class="score-ring-fill" cx="60" cy="60" r="52"></circle>
          </svg>
          <div class="score-text">
            <span id="scoreValue">0</span>
            <span class="score-label">/100</span>
          </div>
        </div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="onpage">On-Page</button>
        <button class="tab-btn" data-tab="technical">Technical</button>
        <button class="tab-btn" data-tab="recommendations">Fixes</button>
        <button class="tab-btn" data-tab="ai">AI Suggestions</button>
      </div>

      <div id="tab-onpage" class="tab-content active">
        <ul id="onPageList"></ul>
      </div>

      <div id="tab-technical" class="tab-content">
        <ul id="technicalList"></ul>
      </div>

      <div id="tab-recommendations" class="tab-content">
        <ul id="recommendationsList"></ul>
      </div>

      <div id="tab-ai" class="tab-content">
        <button id="aiBtn">Get AI Suggestions</button>
        <div id="aiLoading" class="hidden">
          <div class="spinner"></div>
          <span>Thinking...</span>
        </div>
        <div id="aiOutput"></div>
      </div>

    </div>

    <div id="errorMsg" class="hidden"></div>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
